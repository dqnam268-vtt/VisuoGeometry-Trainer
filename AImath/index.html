<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Math Assistant - Pro Version</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body { background-color: #f8fafc; }
        #math-output { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        #math-output p { margin-bottom: 0.75rem; line-height: 1.8; }
        #math-output h3 { color: #1e40af; font-size: 1.125rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 0.5rem; text-transform: uppercase;}
        #math-output strong { color: #4338ca; font-weight: 700; }
        #math-output ul, #math-output ol { margin-left: 1.5rem; margin-bottom: 1rem; }
        #math-output ul { list-style-type: disc; }
        #math-output ol { list-style-type: decimal; }
        #math-output hr { margin: 1.5rem 0; border-color: #e2e8f0; border-width: 2px; }
        #math-output .solution-box { background-color: #f0fdf4; border: 1px solid #bbf7d0; padding: 1.5rem; border-radius: 0.75rem; margin-top: 1rem; margin-bottom: 1.5rem;}
        
        .mjx-chtml { font-size: 115% !important; padding: 2px 0; }
        .mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Camera: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
            Send: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            Image: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Alert: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l5.64 5.64A9 9 0 0 0 20.49 15"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        };

        const App = () => {
            const [inputMethod, setInputMethod] = useState('text');
            const [equation, setEquation] = useState('');
            const [image, setImage] = useState(null);
            const [imagePreview, setImagePreview] = useState(null);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');
            
            const [feedbackStatus, setFeedbackStatus] = useState('');
            const [feedbackNote, setFeedbackNote] = useState('');
            const [isSubmittingForm, setIsSubmittingForm] = useState(false);
            const [formSuccess, setFormSuccess] = useState(false);

            useEffect(() => {
                if (result && window.MathJax) {
                    setTimeout(() => {
                        window.MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err));
                    }, 100);
                }
            }, [result]);

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setImage(file);
                    const reader = new FileReader();
                    reader.onloadend = () => setImagePreview(reader.result);
                    reader.readAsDataURL(file);
                    setResult(null);
                    setFormSuccess(false);
                }
            };

            const fileToBase64 = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = (error) => reject(error);
                });
            };

            // =================================================================
            // Link Google Apps Script Của Bạn
            const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUjAyhN2wrc_pNI9BaTcqC8uMieOg9eB4y5A137YyLMepqs69GkK07gzjUc-iie53m/exec";
            // =================================================================

            const submitFeedback = async () => {
                if (!feedbackStatus) {
                    alert("Vui lòng chọn xem AI có giải đúng không nhé!");
                    return;
                }
                setIsSubmittingForm(true);

                try {
                    const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        },
                        body: JSON.stringify({
                            action: 'feedback',
                            danhGia: feedbackStatus,
                            nhanXet: feedbackNote,
                            baiToan: equation || "Ảnh bài toán"
                        })
                    });
                    setFormSuccess(true);
                } catch (err) {
                    console.error("Lỗi gửi form", err);
                    alert("Không thể kết nối. Vui lòng kiểm tra mạng.");
                } finally {
                    setIsSubmittingForm(false);
                }
            };

            const callGemini = async () => {
                setLoading(true);
                setError('');
                setResult(null);
                setFormSuccess(false);
                setFeedbackStatus('');
                setFeedbackNote('');

                try {
                    let contentsData;
                    const systemPrompt = `Bạn là một chuyên gia Sư phạm Toán học xuất sắc. Nhiệm vụ của bạn là giải bài toán theo một cấu trúc đa chiều, giúp học sinh vừa hiểu sâu, vừa biết cách trình bày.
                    
                    BẮT BUỘC trả lời theo đúng CẤU TRÚC SAU (TUYỆT ĐỐI KHÔNG dùng dấu ###, chỉ dùng in đậm **...** cho các tiêu đề chính):

                    **1. Phân tích trọng tâm**
                    - Viết ngắn gọn tối đa 2 câu để học sinh hiểu bản chất bài toán. Không giải thích dông dài.

                    **2. Các hướng giải quyết**
                    - **Cách 1: [Tên phương pháp]** (Phù hợp: Lớp [X])
                      Mô tả ngắn gọn các bước thực hiện.
                    - **Cách 2: [Tên phương pháp]** (Phù hợp: Lớp [Y] - Tùy chọn nếu có)

                    ---
                    
                    <div class="solution-box">
                    3. Trình bày lời giải
                    (Chỉ viết các phép toán và các bước logic trình bày sạch sẽ. Trình bày y hệt như học sinh chép vào vở thi).
                    
                    **QUAN TRỌNG VỀ ĐỊNH DẠNG TẠI PHẦN NÀY:**
                    - BẮT BUỘC liệt kê các hệ số (a, b, c...) thành từng dòng riêng biệt bằng gạch đầu dòng.
                    - Các bước tính toán liên tiếp thì GỘP TRÊN 1 DÒNG bằng các dấu "=". 
                      Ví dụ ĐÚNG: $x_2 = \\frac{c}{a} = \\frac{3}{1} = 3$ (Tuyệt đối không ngắt xuống dòng cho mỗi dấu bằng).
                    - Kết luận tập nghiệm BẮT BUỘC phải nằm trong dấu ngoặc nhọn. 
                      Ví dụ ĐÚNG: Vậy tập nghiệm của phương trình là $S = \\{1; 3\\}$
                    </div>

                    ---

                    **4. Đánh giá & Lưu ý**
                    - Chỉ ra 1-2 lỗi sai kinh điển học sinh thường mắc phải khi làm dạng này.

                    Yêu cầu kỹ thuật: Dùng LaTeX nội khối $...$ và hiển thị $$...$$ cho toán học. Dùng \\{ và \\} để hiển thị ngoặc nhọn.`;

                    if (inputMethod === 'text') {
                        if (!equation.trim()) throw new Error('Vui lòng nhập phương trình.');
                        contentsData = [{ parts: [{ text: `Giải bài toán: ${equation}` }] }];
                    } else {
                        if (!image) throw new Error('Vui lòng chụp ảnh phương trình.');
                        const base64Data = await fileToBase64(image);
                        contentsData = [{
                            parts: [
                                { text: "Giải bài toán trong ảnh này." },
                                { inlineData: { mimeType: image.type, data: base64Data } }
                            ]
                        }];
                    }

                    const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        },
                        body: JSON.stringify({
                            action: 'solve',
                            contents: contentsData,
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    const data = await response.json();
                    
                    if (data.error) {
                         throw new Error(data.error);
                    }

                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        setResult(text);
                    } else {
                        throw new Error('AI không nhận diện được nội dung hoặc quá tải.');
                    }
                } catch (err) {
                    setError('Lỗi: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const resetForm = () => {
                setResult(null);
                setEquation('');
                setImage(null);
                setImagePreview(null);
                setError('');
                setFormSuccess(false);
            };

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans text-slate-900">
                    {/* Giới hạn độ rộng tối đa để web không bị dàn quá ngang trên màn hình lớn */}
                    <div className="max-w-3xl mx-auto">
                        <header className="mb-10 text-center">
                            <div className="flex items-center justify-center gap-3 mb-2">
                                <div className="p-3 bg-indigo-600 text-white rounded-2xl shadow-lg">
                                    <Icons.Refresh />
                                </div>
                                <h1 className="text-3xl font-extrabold text-slate-800 tracking-tight">AI Math Assistant</h1>
                            </div>
                            <p className="text-slate-500 italic text-sm font-medium">"Học sâu hiểu rộng - Trình bày điểm 10"</p>
                        </header>

                        {/* Thay đổi layout: Sử dụng flex-col để xếp dọc từ trên xuống dưới */}
                        <div className="flex flex-col gap-8">
                            
                            {/* KHỐI 1: KHUNG NHẬP ĐỀ BÀI */}
                            <div className="space-y-4">
                                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-xl border border-slate-100">
                                    <h2 className="text-xl font-bold mb-5 flex items-center gap-2 text-slate-800">
                                        <Icons.Send /> Nhập đề bài
                                    </h2>
                                    
                                    <div className="flex p-1.5 bg-slate-100 rounded-2xl mb-6">
                                        <button 
                                            onClick={() => setInputMethod('text')}
                                            className={`flex-1 py-2.5 text-sm font-bold rounded-xl transition-all ${inputMethod === 'text' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
                                        >
                                            Nhập chữ
                                        </button>
                                        <button 
                                            onClick={() => setInputMethod('image')}
                                            className={`flex-1 py-2.5 text-sm font-bold rounded-xl transition-all ${inputMethod === 'image' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
                                        >
                                            Chụp ảnh
                                        </button>
                                    </div>

                                    {inputMethod === 'text' ? (
                                        <textarea 
                                            className="w-full h-40 p-5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none resize-none transition-all text-lg font-medium"
                                            placeholder="Ví dụ: 2x^2 + 5x - 3 = 0"
                                            value={equation}
                                            onChange={(e) => setEquation(e.target.value)}
                                        />
                                    ) : (
                                        <div className="relative border-3 border-dashed border-slate-200 rounded-2xl p-8 text-center hover:border-indigo-400 transition-all cursor-pointer bg-slate-50 group">
                                            <input type="file" accept="image/*" capture="environment" onChange={handleImageChange} className="absolute inset-0 opacity-0 cursor-pointer z-10" />
                                            {imagePreview ? (
                                                <img src={imagePreview} alt="Preview" className="max-h-56 mx-auto rounded-xl shadow-md object-contain" />
                                            ) : (
                                                <div className="text-slate-400 py-6">
                                                    <div className="flex justify-center mb-4 group-hover:scale-110 transition-transform"><Icons.Camera /></div>
                                                    <p className="text-sm font-bold">Bấm để tải ảnh bài tập</p>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <button 
                                        onClick={callGemini}
                                        disabled={loading}
                                        className={`w-full mt-8 py-4 rounded-2xl font-black text-white transition-all shadow-xl flex items-center justify-center gap-3 ${loading ? 'bg-slate-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 hover:translate-y-[-2px]'}`}
                                    >
                                        {loading ? <div className="animate-spin w-5 h-5 border-3 border-white border-t-transparent rounded-full"></div> : <Icons.Check />}
                                        {loading ? 'Đang phân tích...' : 'PHÂN TÍCH & GIẢI'}
                                    </button>
                                    
                                    {error && (
                                        <div className="mt-5 p-4 bg-red-50 border border-red-100 text-red-600 text-sm rounded-xl flex items-center gap-3 animate-pulse">
                                            <Icons.Alert /> <strong>Lỗi:</strong> {error}
                                        </div>
                                    )}
                                </div>
                                
                                {/* Nút làm mới dời xuống dưới khung nhập liệu */}
                                <button onClick={resetForm} className="text-slate-400 text-sm font-bold hover:text-indigo-500 flex items-center justify-center gap-2 mx-auto transition-colors mt-2">
                                    <Icons.Refresh /> LÀM MỚI BÀI TOÁN KHÁC
                                </button>
                            </div>

                            {/* KHỐI 2: HIỆU ỨNG LOADING (Chỉ hiện khi đang xử lý) */}
                            {loading && (
                                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-xl border border-slate-100">
                                    <div className="space-y-5 animate-pulse flex-1 justify-center flex flex-col">
                                        <div className="h-5 bg-slate-100 rounded-full w-3/4"></div>
                                        <div className="h-5 bg-slate-100 rounded-full w-full"></div>
                                        <div className="h-32 bg-slate-50 rounded-3xl w-full"></div>
                                    </div>
                                </div>
                            )}

                            {/* KHỐI 3: KẾT QUẢ VÀ FEEDBACK (Chỉ hiện khi AI đã trả kết quả) */}
                            {result && (
                                <div className="space-y-8 animate-in fade-in slide-in-from-bottom-8 duration-700">
                                    
                                    {/* Bảng Lời Giải */}
                                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-xl border border-slate-100 flex flex-col">
                                        <h2 className="text-xl font-bold mb-5 text-indigo-600 flex items-center gap-2 border-b border-slate-100 pb-4">
                                            <Icons.Image /> Lời giải chi tiết
                                        </h2>
                                        
                                        <div className="flex-1 overflow-x-auto">
                                            <div 
                                                className="text-slate-800 text-base leading-relaxed" 
                                                id="math-output"
                                                dangerouslySetInnerHTML={{ __html: marked.parse(result, { breaks: true }) }}
                                            />
                                        </div>
                                    </div>
                                    
                                    {/* Phiếu Kiểm Chứng */}
                                    <div className="bg-amber-50 p-6 md:p-8 rounded-3xl border-2 border-amber-200 shadow-lg">
                                        <h3 className="text-lg font-black text-amber-900 mb-5 flex items-center gap-3">
                                            <div className="bg-amber-200 p-2 rounded-lg"><Icons.Check /></div>
                                            PHIẾU ĐÁNH GIÁ (Gửi về Giáo viên)
                                        </h3>
                                        
                                        {formSuccess ? (
                                            <div className="p-4 bg-green-100 text-green-700 rounded-2xl flex items-center gap-3 font-bold">
                                                <Icons.CheckCircle /> Đã gửi đánh giá thành công! Cảm ơn em.
                                            </div>
                                        ) : (
                                            <div className="space-y-6">
                                                <div className="space-y-3">
                                                    <p className="text-sm font-bold text-amber-900">1. Lời giải của AI có chính xác không?</p>
                                                    <div className="flex flex-wrap gap-6">
                                                        <label className="flex items-center gap-3 text-sm font-bold cursor-pointer group">
                                                            <input type="radio" name="check" value="Đúng hoàn toàn" onChange={(e) => setFeedbackStatus(e.target.value)} className="w-5 h-5 text-amber-600" /> 
                                                            <span className="group-hover:text-amber-700">Đúng hoàn toàn</span>
                                                        </label>
                                                        <label className="flex items-center gap-3 text-sm font-bold cursor-pointer group">
                                                            <input type="radio" name="check" value="Có lỗi sai" onChange={(e) => setFeedbackStatus(e.target.value)} className="w-5 h-5 text-amber-600" /> 
                                                            <span className="group-hover:text-amber-700">Có lỗi sai</span>
                                                        </label>
                                                    </div>
                                                </div>

                                                <div className="space-y-2">
                                                    <p className="text-sm font-bold text-amber-900">2. Nhận xét của em (nếu có lỗi sai hoặc chưa hiểu chỗ nào):</p>
                                                    <textarea 
                                                        className="w-full p-4 text-sm bg-white border border-amber-200 rounded-2xl focus:ring-2 focus:ring-amber-500 outline-none shadow-inner"
                                                        placeholder="Viết nhận xét vào đây..."
                                                        rows="3"
                                                        value={feedbackNote}
                                                        onChange={(e) => setFeedbackNote(e.target.value)}
                                                    ></textarea>
                                                </div>

                                                <button 
                                                    onClick={submitFeedback}
                                                    disabled={isSubmittingForm}
                                                    className={`w-full text-white py-4 rounded-2xl text-sm font-black shadow-xl transition-all ${isSubmittingForm ? 'bg-amber-400 cursor-not-allowed' : 'bg-amber-600 hover:bg-amber-700 active:scale-95'}`}
                                                >
                                                    {isSubmittingForm ? 'ĐANG GỬI...' : 'GỬI ĐÁNH GIÁ'}
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
