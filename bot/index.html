<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trợ lý Tuyển sinh - THCS Võ Trường Toản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .typing-indicator span {
            animation: blink 1.4s infinite both;
            height: 6px; width: 6px; background: #3b82f6; border-radius: 50%; display: inline-block; margin: 0 1px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-200 h-screen w-screen flex flex-col justify-center items-center p-0 md:p-4 font-sans overflow-hidden">

    <div class="w-full h-full md:max-w-md md:h-[800px] bg-white md:rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-200">
        
        <div class="bg-blue-800 text-white p-4 flex items-center shadow-md z-10">
            <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-blue-800 font-bold text-xl mr-3 shadow-inner">VTT</div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Trợ lý Tuyển sinh</h1>
                <p class="text-blue-200 text-xs">THCS Võ Trường Toản 26-27</p>
            </div>
        </div>

        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-5 bg-slate-50 scroll-smooth border-b border-gray-100">
            <div class="flex items-start max-w-[90%]">
                <div class="w-8 h-8 rounded-full bg-blue-100 flex-shrink-0 flex items-center justify-center text-blue-800 font-bold text-xs mr-2 shadow-sm">AI</div>
                <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm text-gray-800 text-[15px] border border-gray-100 leading-relaxed">
                    Kính chào Quý phụ huynh! Tôi là Trợ lý AI của trường THCS Võ Trường Toản.<br><br>Quý vị cần hỗ trợ thông tin gì về kỳ thi tuyển sinh năm học 2026-2027 ạ?
                </div>
            </div>
        </div>

        <div class="px-3 py-2 bg-slate-50 overflow-x-auto whitespace-nowrap hide-scrollbar border-t border-gray-100">
            <button onclick="sendQuickMessage('Chỉ tiêu lớp 6 năm nay là bao nhiêu?')" class="inline-block bg-white text-blue-700 border border-blue-200 rounded-full px-4 py-1.5 text-sm font-medium mr-2 hover:bg-blue-50 transition shadow-sm">🎯 Chỉ tiêu lớp 6</button>
            <button onclick="sendQuickMessage('Trường có lớp Tích hợp không?')" class="inline-block bg-white text-blue-700 border border-blue-200 rounded-full px-4 py-1.5 text-sm font-medium mr-2 hover:bg-blue-50 transition shadow-sm">📚 Lớp Tích hợp</button>
            <button onclick="sendQuickMessage('Phòng máy B009 nằm ở đâu?')" class="inline-block bg-white text-blue-700 border border-blue-200 rounded-full px-4 py-1.5 text-sm font-medium mr-2 hover:bg-blue-50 transition shadow-sm">🏫 Sơ đồ phòng máy</button>
        </div>

        <div class="p-3 bg-white flex items-center shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
            <input type="text" id="user-input" class="flex-1 bg-gray-100 text-[15px] rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent" placeholder="Hỏi thêm thông tin..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="send-btn" class="ml-2 w-12 h-12 bg-blue-700 hover:bg-blue-800 text-white rounded-full flex items-center justify-center shadow-lg transition transform active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </div>

    <p class="text-xs text-gray-500 mt-2 text-center w-full max-w-md px-4">Thiết kế bởi Nam</p>

    <script>
        // Link Apps Script của bạn - Hãy đảm bảo đây là link Deploy mới nhất
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzlxfD25u3mLBvCCWorwKfFEMclIzwP6_u5eeFtfBeR_PtIbO5-jYbcZorA3tM384AmQ/exec"; 

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
        function sendQuickMessage(text) { userInput.value = text; sendMessage(); }

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex items-end max-w-[90%] ${isUser ? 'ml-auto flex-row-reverse' : ''}`;
            
            const avatar = isUser ? '' : `<div class="w-8 h-8 rounded-full bg-blue-100 flex-shrink-0 flex items-center justify-center text-blue-800 font-bold text-xs ${isUser ? 'ml-2' : 'mr-2'} shadow-sm">AI</div>`;
            const bubbleStyle = isUser ? 'bg-blue-600 text-white rounded-2xl rounded-tr-none shadow-md' : 'bg-white text-gray-800 border border-gray-100 rounded-2xl rounded-tl-none shadow-sm';
            
            // Xử lý in đậm và xuống dòng đơn giản để hiển thị đẹp hơn
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            
            msgDiv.innerHTML = `${avatar}<div class="${bubbleStyle} p-3 text-[15px] leading-relaxed">${formattedText}</div>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            const id = 'typing-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = `flex items-start max-w-[90%]`;
            msgDiv.innerHTML = `<div class="w-8 h-8 rounded-full bg-blue-100 flex-shrink-0 flex items-center justify-center text-blue-800 font-bold text-xs mr-2 shadow-sm">AI</div><div class="bg-white px-4 py-3 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 flex items-center justify-center typing-indicator h-11"><span></span><span></span><span></span></div>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Vô hiệu hóa input khi đang xử lý
            userInput.disabled = true;
            sendBtn.disabled = true;
            appendMessage('user', message);
            userInput.value = '';

            const typingId = showTyping();

            try {
                // Đã sửa biến thành APPS_SCRIPT_URL
                const finalUrl = APPS_SCRIPT_URL + "?message=" + encodeURIComponent(message);
                
                // Gọi API với phương thức GET và redirect: 'follow'
                const response = await fetch(finalUrl, {
                    method: 'GET',
                    redirect: 'follow'
                });
                
                if (!response.ok) throw new Error("Mạng không ổn định");

                const data = await response.json();
                removeTyping(typingId);
                
                if (data && data.reply) {
                    appendMessage('bot', data.reply);
                } else {
                    appendMessage('bot', "Xin lỗi, mình chưa tìm thấy câu trả lời phù hợp. Bạn thử hỏi cách khác nhé!");
                }

            } catch (error) {
                console.error("Lỗi:", error);
                removeTyping(typingId);
                appendMessage('bot', "❌ Lỗi kết nối: Vui lòng kiểm tra lại mạng hoặc link triển khai trên Google Apps Script.");
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
    </script>
</body>
</html>
